name: paemisyon
description: "Paemisyon — polis eğitim platformu (mobil istemci)."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Kilitli kararlar (Doc 3/5): Flutter + Riverpod + go_router + Dio.
# freezed/drift gibi codegen'li paketler ilgili sprintlerde eklenir (aşağıda not).
dependencies:
  flutter:
    sdk: flutter

  # State management + DI (Doc 3): Riverpod v2
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Kimlik (Doc 8): Supabase Auth — YALNIZCA auth için. Veri hep NestJS API'den.
  supabase_flutter: ^2.8.0

  # Sosyal giriş (Doc 28 P0-①): native Apple/Google → Supabase signInWithIdToken
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.2.2
  crypto: ^3.0.6

  # Güvenli/yerel depolama (kimlik token'ı Sprint 1'de kullanılacak)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # FCM push (Faz 2) — firebase_options.dart 'flutterfire configure' ile üretilir;
  # repodaki stub yapılandırma gelene dek push'u sessizce devre dışı bırakır.
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.0

  # Offline (Sprint 5): bağlantı durumu. Kalıcı kuyruk shared_preferences ile.
  # (Tam offline soru-bankası cache'i için Drift ileride eklenecek.)
  connectivity_plus: ^6.1.0

  # Abonelik/IAP (Sprint 6): StoreKit 2 (iOS) / Play Billing (Android).
  # Doğrulama SUNUCUDA — istemci imzalı işlemi (JWS) backend'e /billing/verify'a yollar.
  in_app_purchase: ^3.2.0

  # Manuel premium akışı: Telegram/Instagram'a dış bağlantı. https URL'leri
  # kullanılır — iOS'ta LSApplicationQueriesSchemes gerekmez (http/https izinli).
  url_launcher: ^6.3.1

  # Yerel bildirim v1 (Doc 28 P1-7): günlük seri hatırlatıcısı — tamamen
  # cihazda zamanlanır, push altyapısı YOK. Varsayılan KAPALI; ayarlardan açılır.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  cupertino_icons: ^1.0.8

  # ── Sonraki sprintlerde eklenecek (codegen gerektirir) ──
  # freezed_annotation + json_annotation   → model katmanı (Sprint 2)
  # drift + sqlite3_flutter_libs           → offline (Sprint 5)
  # firebase_* / google_mobile_ads         → V1+

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Nişangâh P (marka ikonu, Faz 2 varyant A) — kaynak vektörler: /brand/*.svg
# Yeniden üretim: brand/ altında sharp-cli ile PNG'ler, sonra
# `dart run flutter_launcher_icons` (bkz. brand/README).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon_1024.png
  adaptive_icon_background: "#1B3A6B"
  adaptive_icon_foreground: assets/icon/adaptive_fg_1024.png

flutter:
  uses-material-design: true
