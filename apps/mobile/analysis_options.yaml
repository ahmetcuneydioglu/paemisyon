include: package:flutter_lints/flutter.yaml

analyzer:
  # build/: SPM'in indirdiği paket örnek kodları analize girmesin.
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    # require_trailing_commas: dart format ile çakışıyor, kaldırıldı.
